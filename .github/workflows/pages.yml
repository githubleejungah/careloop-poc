# main에 올릴 때마다: 시험 95개(골든셋 · 대화 · 자동 시연 · 드리프트) → 통과하면 site/ 폴더만 GitHub Pages로 배포
# 시험이 실패하면 배포하지 않는다 (위급 놓침 같은 문제가 공개 링크로 나가지 않게)
name: 시험 후 배포

on:
  push:
    branches: [main]
  workflow_dispatch:        # GitHub 화면에서 손으로 다시 실행할 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 시험 (사본 위치 파일이 없으면 사본 점검만 건너뛴다)
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
